services:
  db:
    image: postgres:15-alpine
    container_name: universe_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend 
    container_name: universe_backend
    env_file:
      - .env
    ports:
      - "8000:8000" 
    volumes:
      - ./backend:/app  
    depends_on:
      - db  

volumes:
  postgres_data: