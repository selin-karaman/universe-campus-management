<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Detayları | UniVerse</title>
    <link rel="stylesheet" href="../assets/style.css?v=1.3">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <div class="logo">UniVerse</div>
            <div id="nav-auth" class="auth-buttons">
                <a href="../index.html" class="btn-login">Ana Sayfa</a>
            </div>
        </nav>
    </header>

    <main class="dashboard-layout">
        <section class="feed-section">
            <a href="javascript:history.back()" style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 20px;">← Geri Dön</a>
            
            <div class="feed-card" style="cursor: default; transform: none !important;">
                <span id="event-tag" class="tag tag-event">ETKİNLİK</span>
                <h1 id="event-title" style="font-size: 2.5rem; color: #fff; margin-bottom: 15px;">Yükleniyor...</h1>
                
                <div style="display: flex; gap: 20px; margin-bottom: 30px; color: var(--accent); font-weight: 600;">
                    <span id="event-date">📅 --/--/----</span>
                    <span id="event-location">📍 Konum Yükleniyor...</span>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top: 25px;">
                    <h3 class="section-title" style="margin-bottom: 15px;">Etkinlik Hakkında</h3>
                    <p id="event-description" style="font-size: 1.1rem; line-height: 1.8;">Açıklama yükleniyor...</p>
                </div>
            </div>
        </section>

        <aside class="sidebar-section">
            <h2 class="section-title">Katılımcılar</h2>
            <div id="participants-list" style="margin-bottom: 25px;">
                </div>

            <div id="event-actions">
                </div>
        </aside>
    </main>

    <script src="event-detail.js"></script>
</body>
</html>
