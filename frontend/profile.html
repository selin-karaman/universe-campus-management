<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim | UniVerse</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        /* Profil Sayfasına Özel Ek Stiller */
        .profile-header {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
            position: relative;
        }
        .profile-avatar {
            width: 100px; height: 100px;
            background: #fff; border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #6c5ce7; font-weight: bold;
        }
        .badge {
            background: #ff9900; color: #000;
            padding: 5px 15px; border-radius: 20px;
            font-size: 0.8rem; font-weight: bold;
        }
        .section-title { margin: 30px 0 20px; color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Universe</a>
        <div id="nav-auth"></div>
    </nav>

    <main class="container">
        <section class="profile-header">
            <button onclick="window.location.href='index.html'" 
                style="position: absolute; left: 20px; top: 20px; background: rgba(0,0,0,0.2); border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer;">
            ← Ana Sayfa
            </button>
    <div class="profile-avatar" id="user-initial">U</div>
    <h1 id="user-full-name">Yükleniyor...</h1>
    <p id="user-email" style="opacity: 0.9; margin-top: 5px;"></p>
        </section>

        <h2 class="section-title">✨ Üye Olduğum Topluluklar</h2>
        <div id="my-communities" class="community-grid">
            <p style="color: #636e72;">Yükleniyor...</p>
        </div>
    </main>

    <script src="assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
        });
    </script>
</body>
</html>
