<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Oluştur | UniVerse</title>
    <link rel="stylesheet" href="../assets/style.css?v=1.5">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: var(--bg);
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .login-container h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-container p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--primary);
            background: rgba(125, 95, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(125, 95, 255, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(125, 95, 255, 0.4);
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Hesap Oluştur</h1>
        <p>Kampüsün dijital dünyasına ilk adımı at.</p>
        
        <form id="register-form">
            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label for="name">İsim</label>
                    <input type="text" id="name" placeholder="Selin" required>
                </div>
                <div style="flex: 1;">
                    <label for="surname">Soyisim</label>
                    <input type="text" id="surname" placeholder="Karaman" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">E-posta</label>
                <input type="email" id="email" placeholder="isim@ogr.beun.edu.tr" required>
            </div>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="••••••••" maxlength="72" required>
            </div>
            <button type="submit" class="btn-submit">Kaydı Tamamla</button>
        </form>

        <div style="margin-top: 25px; font-size: 0.9rem; color: var(--text-secondary);">
            Zaten hesabın var mı? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 700;">Giriş Yap</a>
        </div>

        <a href="../index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>

    <script src="auth.js"></script>
</body>
</html>
